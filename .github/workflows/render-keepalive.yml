name: Keep Render Service Alive

on:
  schedule:
    # 9:00 AM and 9:00 PM India Standard Time (UTC+5:30)
    - cron: "30 3,15 * * *"

  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render Application
        run: |
          echo "Pinging Meta-Model..."

          curl -fsSL \
            --connect-timeout 30 \
            --max-time 180 \
            --retry 3 \
            --retry-delay 20 \
            --retry-max-time 420 \
            https://meta-model.onrender.com/ \
            -o /dev/null

          echo "Meta-Model ping successful!"
